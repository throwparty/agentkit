# XXX: neither --fmt nor --dump format only named files

[formatter.just]
command = "hack/fmt/just-fmt.sh"
includes = ["justfile", "**/mod.just"]

[formatter.mdformat]
command = "mdformat"
excludes = ["adrs/*/refs/**"]
includes = ["*.md"]

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
excludes = ["adrs/*/refs/**"]
includes = [
  "*.cjs",
  "*.css",
  "*.html",
  "*.js",
  "*.json",
  "*.jsonc",
  "*.jsx",
  "*.mdx",
  "*.mjs",
  "*.ts",
  "*.tsx",
  "*.yaml",
  "*.yml"
]

[formatter.rust]
# Rustfmt's 2024 style edition sorts imports differently from the 2021 style
# edition, and this workspace mixes both. The wrapper picks the edition from
# each file's nearest Cargo.toml so treefmt matches `cargo fmt`.
command = "hack/fmt/rustfmt.sh"
includes = ["*.rs"]

[formatter.toml-sort]
command = "toml-sort"
options = ["--in-place"]
includes = ["*.toml"]


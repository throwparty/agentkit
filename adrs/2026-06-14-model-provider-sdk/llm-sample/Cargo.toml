[dependencies]
llm = {version = "1.3", default-features = false, features = ["openai"]}
tokio = {version = "1", features = ["full"]}
clap = {version = "4", features = ["derive"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"

[lib]
name = "llm_sample"
path = "src/lib.rs"

[package]
name = "llm-sample"
version = "0.1.0"
edition = "2021"

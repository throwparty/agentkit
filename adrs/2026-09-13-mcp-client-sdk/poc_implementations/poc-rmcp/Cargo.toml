[dependencies]
tokio = {version = "1", features = ["macros", "rt-multi-thread", "process"]}
rmcp = {version = "3.3.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"]}
serde_json = {version = "1.0", features = ["preserve_order"]}
mcp-server = {path = "../mcp-server"}

[package]
name = "poc-rmcp"
version = "0.1.0"
edition = "2021"
default-run = "poc-rmcp"

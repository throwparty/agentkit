[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
git-fetch-with-cli = true
# smartstring is unmaintained (RUSTSEC-2026-0249) and MPL-2.0+, pulled in only by
# rhai 1.x; rhai 2.0 drops it. Exempt until we can upgrade.
ignore = ["RUSTSEC-2026-0249"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0", # smartstring, via rhai 1.x; removed in rhai 2.0
  "Unicode-3.0",
  "Unlicense",
  "Zlib"
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[dependencies]
agentkit-path = { path = "../agentkit-path" }
clap = { version = "4", features = ["derive"] }
git2 = "0.21.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
yaml_serde = "0.10.7"

[dev-dependencies]
tempfile = "3"

[package]
name = "agentkit-tackle"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

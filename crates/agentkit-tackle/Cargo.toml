[package]
name = "agentkit-tackle"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
agentkit-docgen = { path = "../agentkit-docgen" }
agentkit-models = { path = "../agentkit-models" }
agentkit-path = { path = "../agentkit-path" }
agent-client-protocol = "2.2.0"
clap = { version = "4", features = ["derive"] }
daggy = "0.8"
futures = "0.3"
git2 = "0.21"
jiff = { version = "0.2", features = ["serde"] }
petgraph = "0.8"
rig-core = "0.42.0"
rhai = { version = "1.26", features = ["internals"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "testing", "rt-tokio"] }
tracing-opentelemetry = "0.33"
rmcp = { version = "3.2.0", features = [
  "client",
  "server",
  "transport-io",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
  "elicitation",
  "schemars",
] }
 secrecy = "0.10.3"
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "macros",
] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6.5"
yaml_serde = "0.10"

[features]
default = ["unstable"]
# Unstable ACP features: compiled out for the stable-only conformance build.
unstable = [
  "agent-client-protocol/unstable_session_fork",
  "agent-client-protocol/unstable_session_compaction",
  "agent-client-protocol/unstable_session_notices",
]

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tackle-mcp-echo"
path = "src/bin/tackle-mcp-echo.rs"

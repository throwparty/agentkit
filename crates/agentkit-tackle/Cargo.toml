[[bin]]
name = "tackle-conformance-check"
path = "src/bin/tackle-conformance-check.rs"

[[bin]]
name = "tackle-mcp-echo"
path = "src/bin/tackle-mcp-echo.rs"

[[bin]]
name = "tackle-test-model"
path = "src/bin/tackle-test-model.rs"

[dependencies]
agentkit-credentials = {path = "../agentkit-credentials"}
agentkit-docgen = {path = "../agentkit-docgen"}
agentkit-models = {path = "../agentkit-models"}
agentkit-path = {path = "../agentkit-path"}
agentkit-script = {path = "../agentkit-script"}
agent-client-protocol = {version = "3.5.0", features = [
  "process",
  "stdio",
  "unstable_session_fork",
  "unstable_protocol_v2",
]}
clap = {version = "4", features = ["derive"]}
futures = "0.3"
git2 = "0.21"
jiff = {version = "0.2", features = ["serde"]}
rig-core = {version = "0.44.0", features = ["reqwest"]}
reqwest = {version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"]}
axum = "0.8"
tokio-stream = {version = "0.1", features = ["sync"]}
opentelemetry = {version = "0.33", features = ["trace"]}
opentelemetry-otlp = {version = "0.33", features = ["http-proto", "reqwest-blocking-client", "trace"]}
opentelemetry_sdk = {version = "0.33", features = ["trace", "testing", "rt-tokio"]}
tracing-opentelemetry = "0.34"
rmcp = {version = "3.2.0", features = [
  "client",
  "server",
  "transport-io",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
  "elicitation",
  "schemars"
]}
secrecy = "0.10.3"
schemars = "1.0"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
sha2 = "0.11"
sqlx = {version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "macros"
]}
thiserror = "2"
tokio = {version = "1", features = ["rt-multi-thread", "macros", "signal"]}
tokio-util = {version = "0.7", features = ["rt", "compat"]}
toml = "1"
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
uuid = {version = "1", features = ["v4"]}
yaml_serde = "0.10"

[dev-dependencies]
tempfile = "3"
daggy = "0.9"
wiremock = "0.6.5"

[package]
name = "agentkit-tackle"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

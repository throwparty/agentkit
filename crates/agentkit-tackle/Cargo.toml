[dependencies]
agent-client-protocol = { version = "2.2.0", features = [
  "unstable_session_fork",
  "unstable_session_compaction",
  "unstable_session_notices",
] }
agentkit-path = { path = "../agentkit-path" }
clap = { version = "4", features = ["derive"] }
daggy = "0.9.0"
git2 = "0.21.0"
petgraph = "0.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "macros",
] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }
yaml_serde = "0.10.7"

[dev-dependencies]
tempfile = "3"

[package]
name = "agentkit-tackle"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[package]
name = "agentkit-tackle"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
agentkit-path = { path = "../agentkit-path" }
clap = { version = "4", features = ["derive"] }
rig-core = "0.42.0"
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6.5"

[dependencies.agent-client-protocol]
version = "2.2.0"
features = []

[dependencies.serde_json]
version = "1"

[dependencies.sqlx]
version = "0.9.0"
default-features = false
features = ["runtime-tokio", "sqlite", "migrate", "macros"]

[dependencies.sha2]
version = "0.10"

[dependencies.git2]
version = "0.21"

[dependencies.jiff]
version = "0.2"
features = ["serde"]

[dependencies.uuid]
version = "1"
features = ["v4"]

[dependencies.daggy]
version = "0.8"

[dependencies.yaml_serde]
version = "0.10"

[features]
default = ["unstable"]
# Unstable ACP features: compiled out for the stable-only conformance build.
unstable = [
  "agent-client-protocol/unstable_session_fork",
  "agent-client-protocol/unstable_session_compaction",
  "agent-client-protocol/unstable_session_notices",
]
# The SDK is only optional when it is not used at all; keep it always on by
# making `unstable` not affect optionality.

[dev-dependencies]
tempfile = "3"

[dependencies]
tokio = {version = "1", features = ["full"]}
tokio-stream = "0.1"
clap = {version = "4", features = ["derive"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
toml = "1"
reqwest = {version = "0.12", features = ["stream", "json"]}
opentelemetry = {version = "0.32", features = ["trace", "metrics", "logs"]}
opentelemetry-otlp = {version = "0.32", features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs"]}
opentelemetry_sdk = {version = "0.32", features = ["trace", "metrics", "logs", "testing", "rt-tokio"]}
opentelemetry-stdout = "0.32"
thiserror = "2"
tracing = {version = "0.1", features = ["attributes"]}
tracing-opentelemetry = "0.33"
tracing-subscriber = {version = "0.3", features = ["json", "env-filter", "registry"]}
uuid = {version = "1", features = ["v4"]}
axum = {version = "0.8", features = ["macros"]}
tower-http = {version = "0.6", features = ["cors", "trace"]}
sqlx = {version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"]}
oauth2 = {version = "5", default-features = false, features = ["reqwest", "pkce-plain"]}
url = "2"
chrono = {version = "0.4", features = ["serde"]}
open = "5"
base64 = "0.22"
agentkit-models = {path = "../agentkit-models"}
agentkit-docgen = {path = "../agentkit-docgen"}
agentkit-path = {path = "../agentkit-path"}

[dev-dependencies]
wiremock = "0.6"
tracing-test = "0.2"
tempfile = "3"
tower = {version = "0.5", default-features = false}
http-body-util = "0.1"

[package]
name = "agentkit-switchboard"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

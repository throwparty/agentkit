# Architecture rules for the ACP and Litterbox module boundaries.
#
# The ACP wire surfaces in agentkit-tackle (adrs/2026-10-23-tackle-acp-v2) and
# the Litterbox contract, backends, orchestrator, registry and provisioning
# resolver (adrs/2026-11-03-sandbox-provider-contract and
# adrs/2026-11-05-sandbox-provisioning).

preset = "minimal"

[[deny-scope-dep]]
from = "acp-v1"
to = ["acp-v2"]
message = "acp::v1 must not depend on acp::v2; share through acp::common."

[[deny-scope-dep]]
from = "acp-v2"
to = ["acp-v1"]
message = "acp::v2 must not depend on acp::v1; share through acp::common."

[[deny-scope-dep]]
from = "acp-transport"
to = ["acp-v1", "acp-v2"]
message = "The transport must not depend on a protocol version; reach shared state through acp::common."

[[deny-scope-dep]]
from = "litterbox-contract"
to = [
  "litterbox-backend-docker",
  "litterbox-registry",
  "litterbox-orchestrator",
  "litterbox-persistence",
  "litterbox-cli",
  "litterbox-mcp",
  "litterbox-config",
  "litterbox-scm",
  "litterbox-vcs-store",
  "litterbox-shared",
  "litterbox-provision"
]
message = "the contract imports nothing internal; put conversions and adapters outside sandbox."

[[deny-scope-dep]]
from = "litterbox-backend-docker"
to = [
  "litterbox-registry",
  "litterbox-orchestrator",
  "litterbox-persistence",
  "litterbox-cli",
  "litterbox-mcp",
  "litterbox-config",
  "litterbox-scm",
  "litterbox-vcs-store",
  "litterbox-shared",
  "litterbox-provision"
]
message = "a backend depends on the contract only; branches, records, commands and the shared kernel are not its business."

[[deny-scope-dep]]
from = "litterbox-registry"
to = [
  "litterbox-orchestrator",
  "litterbox-persistence",
  "litterbox-cli",
  "litterbox-mcp",
  "litterbox-scm",
  "litterbox-vcs-store",
  "litterbox-provision"
]
message = "the registry constructs a backend; it does not pair branches, persist records or serve surfaces."

[[deny-scope-dep]]
from = "litterbox-cli"
to = ["litterbox-backend-docker", "litterbox-scm", "litterbox-vcs-store", "litterbox-provision"]
message = "the CLI reaches a backend through the orchestrator and the registry, never its module; branches, bare clones and the provisioning resolver are the orchestrator's business."

[[deny-scope-dep]]
from = "litterbox-mcp"
to = ["litterbox-backend-docker", "litterbox-scm", "litterbox-vcs-store", "litterbox-provision"]
message = "the MCP server reaches a backend through the orchestrator and the registry, never its module; branches, bare clones and the provisioning resolver are the orchestrator's business."

[[deny-scope-dep]]
from = "litterbox-config"
to = [
  "litterbox-backend-docker",
  "litterbox-registry",
  "litterbox-orchestrator",
  "litterbox-persistence",
  "litterbox-cli",
  "litterbox-mcp",
  "litterbox-scm",
  "litterbox-vcs-store",
  "litterbox-provision"
]
message = "configuration describes settings; it does not reach a mechanism, a record, a branch, a surface or the resolver."

[[deny-scope-dep]]
from = "litterbox-persistence"
to = [
  "litterbox-backend-docker",
  "litterbox-registry",
  "litterbox-orchestrator",
  "litterbox-cli",
  "litterbox-mcp",
  "litterbox-config",
  "litterbox-scm",
  "litterbox-vcs-store",
  "litterbox-shared"
]
message = "persistence depends on the contract's record types only."

[[deny-scope-dep]]
from = "litterbox-orchestrator"
to = ["litterbox-backend-docker"]
message = "the orchestrator selects a backend through the registry; it does not name a mechanism."

[[deny-scope-dep]]
from = "litterbox-provision"
to = [
  "litterbox-backend-docker",
  "litterbox-registry",
  "litterbox-orchestrator",
  "litterbox-persistence",
  "litterbox-cli",
  "litterbox-mcp",
  "litterbox-scm",
  "litterbox-vcs-store",
  "litterbox-shared"
]
message = "the resolver depends on the contract and configuration only; it does not reach a mechanism, a record, a branch or a surface."

[rules.no-unwrap-expect]
enabled = false

[[scopes]]
name = "acp-common"
paths = ["crates/agentkit-tackle/src/acp/common/**"]

[[scopes]]
name = "acp-v1"
paths = ["crates/agentkit-tackle/src/acp/v1/**"]

[[scopes]]
name = "acp-v2"
paths = ["crates/agentkit-tackle/src/acp/v2/**"]

[[scopes]]
name = "acp-transport"
paths = ["crates/agentkit-tackle/src/acp/transport/**"]

[[scopes]]
name = "litterbox-contract"
paths = ["crates/agentkit-litterbox/src/sandbox/**"]

[[scopes]]
name = "litterbox-backend-docker"
paths = ["crates/agentkit-litterbox/src/backends/docker/**"]

[[scopes]]
name = "litterbox-registry"
paths = [
  "crates/agentkit-litterbox/src/backends/mod.rs",
  "crates/agentkit-litterbox/src/backends/registry.rs"
]

[[scopes]]
name = "litterbox-orchestrator"
paths = ["crates/agentkit-litterbox/src/orchestrator/**"]

[[scopes]]
name = "litterbox-provision"
paths = ["crates/agentkit-litterbox/src/provision/**"]

[[scopes]]
name = "litterbox-persistence"
paths = ["crates/agentkit-litterbox/src/metadata_store.rs"]

[[scopes]]
name = "litterbox-cli"
paths = ["crates/agentkit-litterbox/src/cli.rs"]

[[scopes]]
name = "litterbox-mcp"
paths = [
  "crates/agentkit-litterbox/src/mcp.rs",
  "crates/agentkit-litterbox/src/mcp/**"
]

[[scopes]]
name = "litterbox-config"
paths = [
  "crates/agentkit-litterbox/src/config.rs",
  "crates/agentkit-litterbox/src/config_loader.rs"
]

[[scopes]]
name = "litterbox-scm"
paths = ["crates/agentkit-litterbox/src/scm/**"]

[[scopes]]
name = "litterbox-vcs-store"
paths = ["crates/agentkit-litterbox/src/vcs_store/**"]

[[scopes]]
name = "litterbox-shared"
paths = ["crates/agentkit-litterbox/src/domain/**"]

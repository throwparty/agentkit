# Architecture rules for the ACP and Litterbox module boundaries.
#
# The ACP wire surfaces in agentkit-tackle (adrs/2026-10-23-tackle-acp-v2) and
# the Litterbox contract, backends, orchestrator, registry and provisioning
# resolver (adrs/2026-11-03-sandbox-provider-contract,
# adrs/2026-11-05-sandbox-provisioning and
# adrs/2026-11-07-linux-bwrap-provider).
#
# Two separations carry the design:
#
# - a protocol version is reached through acp::common, never through the other
# version;
# - a compute provider (a backend) is reached through the contract, never
# through the Nix development-shell layer, and that layer never reaches a
# mechanism. A devShell is something a project declares; which mechanism runs
# it is a separate decision.

preset = "minimal"

[[allow-dep]]
from = "litterbox-prepare"
to = ["litterbox-contract", "litterbox-kinds"]
doc = "adrs/2026-11-07-linux-bwrap-provider"

[[allow-dep]]
from = "litterbox-kinds"
to = ["litterbox-contract"]
doc = "adrs/2026-11-07-linux-bwrap-provider"

[[allow-dep]]
from = "litterbox-backend-bubblewrap"
to = ["litterbox-contract"]
doc = "adrs/2026-11-07-linux-bwrap-provider"

[[deny-scope-dep]]
from = "acp-v1"
to = ["acp-v2"]
message = "acp::v1 must not depend on acp::v2; share through acp::common."

[[deny-scope-dep]]
from = "acp-v2"
to = ["acp-v1"]
message = "acp::v2 must not depend on acp::v1; share through acp::common."

[[deny-scope-dep]]
from = "acp-transport"
to = ["acp-v1", "acp-v2"]
message = "The transport must not depend on a protocol version; reach shared state through acp::common."

[[deny-scope-dep]]
from = "litterbox-contract"
to = [
  "litterbox-backend-docker",
  "litterbox-backend-bubblewrap",
  "litterbox-registry",
  "litterbox-orchestrator",
  "litterbox-persistence",
  "litterbox-cli",
  "litterbox-mcp",
  "litterbox-config",
  "litterbox-scm",
  "litterbox-vcs-store",
  "litterbox-shared",
  "litterbox-provision",
  "litterbox-kinds",
  "litterbox-prepare"
]
message = "the contract imports nothing internal; put conversions and adapters outside sandbox."

[[deny-scope-dep]]
from = "litterbox-backend-docker"
to = [
  "litterbox-registry",
  "litterbox-orchestrator",
  "litterbox-persistence",
  "litterbox-cli",
  "litterbox-mcp",
  "litterbox-config",
  "litterbox-scm",
  "litterbox-vcs-store",
  "litterbox-shared",
  "litterbox-provision",
  "litterbox-kinds",
  "litterbox-prepare"
]
message = "a backend depends on the contract only; branches, records, commands and the shared kernel are not its business."

[[deny-scope-dep]]
from = "litterbox-backend-bubblewrap"
to = [
  "litterbox-registry",
  "litterbox-orchestrator",
  "litterbox-persistence",
  "litterbox-cli",
  "litterbox-mcp",
  "litterbox-config",
  "litterbox-scm",
  "litterbox-vcs-store",
  "litterbox-provision",
  "litterbox-kinds",
  "litterbox-prepare"
]
message = "a backend depends on the contract only; branches, records, commands and the kernel are not its business."

[[deny-scope-dep]]
from = "litterbox-registry"
to = [
  "litterbox-orchestrator",
  "litterbox-persistence",
  "litterbox-cli",
  "litterbox-mcp",
  "litterbox-scm",
  "litterbox-vcs-store",
  "litterbox-provision",
  "litterbox-kinds",
  "litterbox-prepare"
]
message = "the registry constructs a backend; it does not pair branches, persist records or serve surfaces."

[[deny-scope-dep]]
from = "litterbox-cli"
to = [
  "litterbox-backend-docker",
  "litterbox-backend-bubblewrap",
  "litterbox-scm",
  "litterbox-vcs-store",
  "litterbox-provision",
  "litterbox-kinds",
  "litterbox-prepare"
]
message = "the CLI reaches a backend through the orchestrator and the registry, never its module; branches, bare clones and the provisioning resolver are the orchestrator's business."

[[deny-scope-dep]]
from = "litterbox-mcp"
to = [
  "litterbox-backend-docker",
  "litterbox-backend-bubblewrap",
  "litterbox-scm",
  "litterbox-vcs-store",
  "litterbox-provision",
  "litterbox-kinds",
  "litterbox-prepare"
]
message = "the MCP server reaches a backend through the orchestrator and the registry, never its module; branches, bare clones and the provisioning resolver are the orchestrator's business."

[[deny-scope-dep]]
from = "litterbox-config"
to = [
  "litterbox-backend-docker",
  "litterbox-registry",
  "litterbox-orchestrator",
  "litterbox-persistence",
  "litterbox-cli",
  "litterbox-mcp",
  "litterbox-scm",
  "litterbox-vcs-store",
  "litterbox-provision",
  "litterbox-prepare"
]
message = "configuration describes settings; it may reach the pure kind registry but never a mechanism, a record, a branch, a surface, the resolver or host preparation."

[[deny-scope-dep]]
from = "litterbox-persistence"
to = [
  "litterbox-backend-docker",
  "litterbox-backend-bubblewrap",
  "litterbox-registry",
  "litterbox-orchestrator",
  "litterbox-cli",
  "litterbox-mcp",
  "litterbox-config",
  "litterbox-scm",
  "litterbox-vcs-store",
  "litterbox-shared",
  "litterbox-kinds",
  "litterbox-prepare"
]
message = "persistence depends on the contract's record types only."

[[deny-scope-dep]]
from = "litterbox-orchestrator"
to = ["litterbox-backend-docker", "litterbox-backend-bubblewrap"]
message = "the orchestrator selects a backend through the registry; it does not name a mechanism."

[[deny-scope-dep]]
from = "litterbox-provision"
to = [
  "litterbox-backend-docker",
  "litterbox-backend-bubblewrap",
  "litterbox-registry",
  "litterbox-orchestrator",
  "litterbox-persistence",
  "litterbox-cli",
  "litterbox-mcp",
  "litterbox-scm",
  "litterbox-vcs-store",
  "litterbox-shared",
  "litterbox-prepare"
]
message = "the resolver depends on the contract, configuration and the pure kind registry; it does not reach a mechanism, host preparation, a record, a branch or a surface."

[[deny-scope-dep]]
from = "litterbox-kinds"
to = [
  "litterbox-backend-docker",
  "litterbox-backend-bubblewrap",
  "litterbox-registry",
  "litterbox-orchestrator",
  "litterbox-persistence",
  "litterbox-cli",
  "litterbox-mcp",
  "litterbox-config",
  "litterbox-scm",
  "litterbox-vcs-store",
  "litterbox-shared",
  "litterbox-provision",
  "litterbox-prepare"
]
message = "the kind registry is pure: it depends on the contract only, and the resolver, configuration and preparation use it."

[[deny-scope-dep]]
from = "litterbox-prepare"
to = [
  "litterbox-backend-docker",
  "litterbox-backend-bubblewrap",
  "litterbox-registry",
  "litterbox-orchestrator",
  "litterbox-persistence",
  "litterbox-cli",
  "litterbox-mcp",
  "litterbox-config",
  "litterbox-scm",
  "litterbox-vcs-store",
  "litterbox-shared",
  "litterbox-provision"
]
message = "host preparation depends on the contract and the pure kind registry; the orchestrator is its only caller."

[[independent]]
name = "nix-vs-compute"
scopes = [
  "litterbox-prepare",
  "litterbox-backend-docker",
  "litterbox-backend-bubblewrap"
]
doc = "adrs/2026-11-07-linux-bwrap-provider"

[[independent]]
name = "kinds-vs-compute"
scopes = [
  "litterbox-kinds",
  "litterbox-backend-docker",
  "litterbox-backend-bubblewrap"
]
doc = "adrs/2026-11-07-linux-bwrap-provider"

[rules.no-unwrap-expect]
enabled = false

[[scopes]]
name = "acp-common"
paths = ["crates/agentkit-tackle/src/acp/common/**"]

[[scopes]]
name = "acp-v1"
paths = ["crates/agentkit-tackle/src/acp/v1/**"]

[[scopes]]
name = "acp-v2"
paths = ["crates/agentkit-tackle/src/acp/v2/**"]

[[scopes]]
name = "acp-transport"
paths = ["crates/agentkit-tackle/src/acp/transport/**"]

[[scopes]]
name = "litterbox-contract"
paths = ["crates/agentkit-litterbox/src/sandbox/**"]

[[scopes]]
name = "litterbox-backend-docker"
paths = ["crates/agentkit-litterbox/src/backends/docker/**"]

[[scopes]]
name = "litterbox-backend-bubblewrap"
paths = ["crates/agentkit-litterbox/src/backends/bubblewrap/**"]

[[scopes]]
name = "litterbox-registry"
paths = [
  "crates/agentkit-litterbox/src/backends/mod.rs",
  "crates/agentkit-litterbox/src/backends/registry.rs"
]

[[scopes]]
name = "litterbox-orchestrator"
paths = ["crates/agentkit-litterbox/src/orchestrator/**"]

[[scopes]]
name = "litterbox-kinds"
paths = ["crates/agentkit-litterbox/src/provision/kind/**"]

[[scopes]]
name = "litterbox-prepare"
paths = ["crates/agentkit-litterbox/src/provision/prepare/**"]

[[scopes]]
name = "litterbox-provision"
paths = [
  "crates/agentkit-litterbox/src/provision/mod.rs",
  "crates/agentkit-litterbox/src/provision/resolve.rs"
]

[[scopes]]
name = "litterbox-persistence"
paths = ["crates/agentkit-litterbox/src/metadata_store.rs"]

[[scopes]]
name = "litterbox-cli"
paths = ["crates/agentkit-litterbox/src/cli.rs"]

[[scopes]]
name = "litterbox-mcp"
paths = [
  "crates/agentkit-litterbox/src/mcp.rs",
  "crates/agentkit-litterbox/src/mcp/**"
]

[[scopes]]
name = "litterbox-config"
paths = [
  "crates/agentkit-litterbox/src/config.rs",
  "crates/agentkit-litterbox/src/config_loader.rs"
]

[[scopes]]
name = "litterbox-scm"
paths = ["crates/agentkit-litterbox/src/scm/**"]

[[scopes]]
name = "litterbox-vcs-store"
paths = ["crates/agentkit-litterbox/src/vcs_store/**"]

[[scopes]]
name = "litterbox-shared"
paths = ["crates/agentkit-litterbox/src/domain/**"]

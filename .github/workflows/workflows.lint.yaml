name: "Workflows: lint"

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Cachix authentication token used to push built store paths
        required: false
      CACHIX_SIGNING_KEY:
        description: Cachix signing key used to push built store paths
        required: false

concurrency:
  group: workflows.lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: nix develop ./nix --command bash -euo pipefail {0} # zizmor: ignore[misfeature]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Nix
        uses: $/.github/actions/setup-nix
        with:
          push-name: ${{ vars.CACHIX_PUSH_CACHE }}
          pull-names: ${{ vars.CACHIX_PULL_CACHES }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }} # zizmor: ignore[secrets-outside-env]
          cachix-signing-key: ${{ secrets.CACHIX_SIGNING_KEY }} # zizmor: ignore[secrets-outside-env]
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run actionlint
        run: just workflows actionlint
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: just workflows zizmor

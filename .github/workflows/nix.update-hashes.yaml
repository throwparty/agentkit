name: "Nix: update hashes"

on:
  workflow_call:
    inputs:
      head-ref:
        required: true
        type: string
      head-sha:
        required: true
        type: string
      pr-body:
        required: true
        type: string
      is-fork:
        required: true
        type: boolean

concurrency:
  group: nix-update-hashes-${{ inputs.head-ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update:
    name: Update
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # To push cargo hash updates
    defaults:
      run:
        shell: nix develop ./nix --command bash -euo pipefail {0}
    if: ${{ !inputs.is-fork }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.head-ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check and update cargo hash
        id: update-hash
        run: just nix update-hash
      - name: Check PR body for no-modification tag
        id: pr-body-check
        uses: ./.github/actions/check-pr-body
        with:
          tag: no modification
          body: ${{ inputs.pr-body }}
      - name: Commit and push
        if: >-
          steps.update-hash.outcome == 'success' &&
          steps.pr-body-check.outputs.matched != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/workflows/nix.update-hashes/commit-and-push-hash-update.sh

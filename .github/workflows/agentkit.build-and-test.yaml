name: "AgentKit: build and test"

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Cachix authentication token used to push built store paths
        required: false
      CACHIX_SIGNING_KEY:
        description: Cachix signing key used to push built store paths
        required: false

concurrency:
  group: agentkit.build-and-test-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: nix develop ./nix --command bash -euo pipefail {0} # zizmor: ignore[misfeature]
    permissions:
      actions: write # To manage cargo caches
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Nix
        uses: $/.github/actions/setup-nix
        with:
          push-name: ${{ vars.CACHIX_PUSH_CACHE }}
          pull-names: ${{ vars.CACHIX_PULL_CACHES }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }} # zizmor: ignore[secrets-outside-env]
          cachix-signing-key: ${{ secrets.CACHIX_SIGNING_KEY }} # zizmor: ignore[secrets-outside-env]
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            .cargo/registry
            .cargo/git
            target
            .cargo/advisory-dbs
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Lint
        if: "!cancelled()"
        run: cargo clippy --locked --all-targets --all-features
      - name: Check architecture boundary
        if: "!cancelled()"
        run: arch-lint check
      - name: Check
        if: "!cancelled()"
        run: cargo check --locked
      - name: Test
        if: "!cancelled()"
        run: cargo test --locked
      - name: Run audit
        if: "!cancelled()"
        run: cargo deny check

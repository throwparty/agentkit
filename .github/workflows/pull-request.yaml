name: Pull request

on:
  pull_request:

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      agentkit: ${{ steps.filter.outputs.agentkit }}
      agentkit-cargo: ${{ steps.filter.outputs.agentkit-cargo }}
      docs: ${{ steps.filter.outputs.docs }}
      nix: ${{ steps.filter.outputs.nix }}
      tackle-conformance: ${{ steps.filter.outputs.tackle-conformance }}
      workflows: ${{ steps.filter.outputs.workflows }}
      snapshot: ${{ steps.pr-body-check.outputs.matched }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check PR body for snapshot tag
        id: pr-body-check
        uses: $/.github/actions/check-pr-body
        with:
          tag: snapshot
          body: ${{ github.event.pull_request.body }}
      - name: Detect changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            agentkit-cargo:
              - 'Cargo.toml'
              - 'Cargo.lock'
            agentkit:
              - 'crates/**'
              - 'deny.toml'
              - '.goreleaser.yaml'
            docs:
              - 'docs/**'
            nix:
              - 'nix/**'
            tackle-conformance:
              - 'crates/agentkit-tackle/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'nix/flake.nix'
              - 'nix/flake.lock'
              - 'justfile'
              - '.github/workflows/tackle.conformance.yaml'
            workflows:
              - '.github/workflows/**'

  test:
    name: Build and test
    needs: changes
    if: >
      needs.changes.outputs.agentkit == 'true' ||
      needs.changes.outputs.agentkit-cargo == 'true'
    permissions:
      actions: write # Called workflow uses it for cargo caches
      contents: read
    uses: $/.github/workflows/agentkit.build-and-test.yaml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}

  conformance:
    name: Tackle conformance
    needs: changes
    if: needs.changes.outputs.tackle-conformance == 'true'
    permissions:
      actions: write # Called workflow uses it for cargo caches
      contents: read
    uses: $/.github/workflows/tackle.conformance.yaml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}

  docs:
    name: Build docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    permissions:
      contents: read
      pages: read # To configure Pages and upload build artifact
      packages: read # To pull @throwparty/* from GitHub Packages
      id-token: write # Required by actions/configure-pages
    uses: $/.github/workflows/docs.build.yaml

  lint-workflows:
    name: Lint workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/workflows.lint.yaml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}

  lint-nix:
    name: Lint Nix
    needs: changes
    if: >
      needs.changes.outputs.agentkit == 'true' ||
      needs.changes.outputs.agentkit-cargo == 'true' ||
      needs.changes.outputs.nix == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/nix.lint.yaml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}

  release-snapshot:
    name: Release snapshot
    needs: changes
    if: >
      (needs.changes.outputs.agentkit == 'true' ||
       needs.changes.outputs.agentkit-cargo == 'true') &&
      needs.changes.outputs.snapshot == 'true'
    permissions:
      actions: write # Called workflow uses it for build caches
      contents: write # Called workflow publishes snapshot artifacts
      id-token: write # Called workflow uses keyless signing
    uses: $/.github/workflows/agentkit.build-and-release.yaml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
    with:
      build-is-snapshot: true

  ready:
    name: Ready
    needs: [test, docs, lint-workflows, lint-nix, release-snapshot]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check dependencies
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
